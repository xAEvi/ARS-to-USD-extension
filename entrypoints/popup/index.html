<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>ARS to USD</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <h1>ARS a USD</h1>

      <section id="activation">
        <label class="switch-label">
          <input id="activate" type="checkbox" checked />
          Activa en este sitio
        </label>
        <p id="activation-hint">
          Subrayá un monto en pesos para verlo convertido a dólares. Activa por
          defecto en todas partes; destildá para desactivarla en este sitio.
        </p>
      </section>

      <section id="rate-status" aria-live="polite">
        <p id="rate-house"></p>
        <p id="rate-value">Cargando cotización...</p>
        <p id="rate-meta"></p>
      </section>

      <section id="rate-config">
        <label for="rate-source">Cotización a usar</label>
        <select id="rate-source">
          <option value="oficial">Dólar oficial</option>
          <option value="blue">Dólar blue</option>
          <option value="bolsa">Dólar bolsa (MEP)</option>
          <option value="contadoconliqui">Dólar contado con liqui (CCL)</option>
          <option value="tarjeta">Dólar tarjeta</option>
          <option value="mayorista">Dólar mayorista</option>
          <option value="cripto">Dólar cripto</option>
          <option value="manual">Manual</option>
        </select>

        <div id="manual-rate-field" hidden>
          <label for="manual-rate">Cotización manual (ARS por USD)</label>
          <input id="manual-rate" type="number" min="0" step="0.01" />
          <p id="manual-rate-error" class="error" hidden></p>
        </div>
      </section>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
